<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>芬兰HCT（High Capacity Transport）车辆组合通道圆计算手册</title>

<style>:root{color-scheme:light}img{max-width:100%}</style>
<style>
  :root{
    --paper:#f3f4ef;
    --paper-dim:#eceee7;
    --ink:#1b2220;
    --ink-soft:#4d5651;
    --line:#c7cbbe;
    --line-soft:#dadcd2;
    --accent:#26545f;
    --accent-2:#3d7c86;
    --accent-soft:#dbe6e4;
    --warn:#a95a26;
    --good:#3c7a4e;
    --good-bg:#e4efe6;
    --bad:#a63b34;
    --bad-bg:#f5e4e2;
    --sans:"PingFang SC","Helvetica Neue","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}
  a{color:var(--accent);}
  .app{max-width:1360px;margin:0 auto;padding:0 28px 80px;}

  /* ---------- split shell: sidebar + content, always both visible ---------- */
  .shell{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:start;padding-top:28px;}
  .sidebar{
    position:sticky;top:78px;max-height:calc(100vh - 96px);overflow-y:auto;
    display:flex;flex-direction:column;gap:24px;padding:2px 10px 20px 2px;margin:-2px -10px 0 -2px;
  }
  @media (max-width:920px){
    .shell{grid-template-columns:1fr;}
    .sidebar{position:static;max-height:none;}
  }
  .side-block{display:flex;flex-direction:column;gap:8px;}
  .section-label.small{font-size:10.5px;margin-bottom:2px;}
  .side-list{display:flex;flex-direction:column;gap:6px;}
  .side-item{
    display:flex;align-items:center;gap:10px;text-align:left;width:100%;
    background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px 10px;
    cursor:pointer;font-family:inherit;color:inherit;transition:border-color .15s, background-color .15s;
  }
  .side-item:hover{border-color:var(--accent-2);}
  .side-item.active{border-color:var(--accent);background:var(--accent-soft);}
  .side-item.disabled{cursor:default;opacity:.55;}
  .side-item.disabled:hover{border-color:var(--line);}
  .side-diagram{flex:none;width:80px;}
  .side-diagram svg{display:block;width:100%;height:auto;}
  .side-item-text{min-width:0;}
  .side-item-top{margin-bottom:2px;}
  .side-item-name{font-size:12px;font-weight:600;line-height:1.35;}
  .side-item-tab{gap:9px;}
  .side-item-tab .side-item-name{font-size:12.5px;}
  .mini-note{margin-left:auto;flex:none;font-family:var(--mono);font-size:9.5px;color:var(--warn);white-space:nowrap;}
  .content{min-width:0;}

  /* ---------- header ---------- */
  header.top{
    position:sticky;top:0;z-index:40;
    background:rgba(243,244,239,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{
    max-width:1180px;margin:0 auto;padding:14px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand-mark{
    width:34px;height:34px;border:1.5px solid var(--accent);border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;
    flex:none;
  }
  .brand-text .eyebrow{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);font-weight:600;
  }
  .brand-text h1{margin:1px 0 0;font-size:16px;font-weight:700;letter-spacing:.01em;}
  .top-actions{display:flex;gap:10px;align-items:center;}
  .btn{
    font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em;
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:8px 14px;border-radius:3px;cursor:pointer;text-decoration:none;
    display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,color .15s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn:focus-visible, a:focus-visible, .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.ghost{border-color:transparent;background:transparent;padding:8px 4px;}

  /* ---------- hero / intro ---------- */
  .intro{padding:0 0 28px;border-bottom:1px solid var(--line);margin-bottom:36px;}
  .kicker{
    font-family:var(--mono);font-size:12px;color:var(--accent-2);letter-spacing:.04em;
    margin-bottom:10px;
  }
  .intro h2{
    font-size:clamp(24px,3.4vw,34px);margin:0 0 14px;font-weight:800;letter-spacing:-.01em;
    text-wrap:balance;max-width:26ch;
  }
  .intro p{max-width:66ch;color:var(--ink-soft);font-size:15px;margin:0 0 6px;}
  .intro .rule-strip{
    display:flex;flex-wrap:wrap;gap:22px;margin-top:22px;font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);
  }
  .rule-strip b{color:var(--ink);font-weight:700;}
  .source-line{margin-top:18px;font-size:12.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px 16px;}
  .source-line a{text-decoration:none;border-bottom:1px dotted var(--accent-2);}

  /* ---------- scenario grid ---------- */
  .section-label{
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent-2);font-weight:700;margin:0 0 16px;
    display:flex;align-items:center;gap:10px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:48px;
  }
  .card{
    background:#fff;border:1px solid var(--line);border-radius:4px;
    display:flex;flex-direction:column;overflow:hidden;
    cursor:pointer;text-align:left;padding:0;font-family:inherit;color:inherit;
    transition:box-shadow .15s, border-color .15s, transform .15s;
  }
  .card:hover{border-color:var(--accent-2);box-shadow:0 6px 18px -10px rgba(30,50,50,.35);transform:translateY(-1px);}
  .card.disabled{cursor:default;}
  .card.disabled:hover{transform:none;box-shadow:none;border-color:var(--line);}
  .diagram-wrap{
    background:
      linear-gradient(var(--paper-dim) 1px,transparent 1px) 0 0/100% 14px,
      linear-gradient(90deg,var(--paper-dim) 1px,transparent 1px) 0 0/14px 100%,
      #fbfbf8;
    border-bottom:1px solid var(--line);
    padding:10px 6px 0;
  }
  .diagram-wrap svg{display:block;width:100%;height:auto;}
  .card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .type-row{display:flex;align-items:center;gap:8px;}
  .type-badge{
    font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--accent);
    padding:2px 7px;border-radius:2px;letter-spacing:.02em;flex:none;
  }
  .type-badge.muted{background:var(--ink-soft);}
  .type-badge.mini{font-size:9.5px;padding:1px 5px;}
  .fi-name{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);}
  .cn-name{font-size:15px;font-weight:700;margin:2px 0 0;letter-spacing:-.005em;}
  .card-desc{font-size:12.8px;color:var(--ink-soft);flex:1;}
  .card-foot{
    margin-top:8px;padding-top:10px;border-top:1px dashed var(--line-soft);
    display:flex;align-items:center;justify-content:space-between;font-size:12px;
  }
  .tab-tag{font-family:var(--mono);color:var(--accent-2);font-weight:600;}
  .go-arrow{color:var(--accent);font-weight:700;}
  .note-tag{font-size:11.5px;color:var(--warn);font-weight:600;}

  /* ---------- legend ---------- */
  .legend{display:flex;flex-wrap:wrap;gap:14px 22px;margin:-6px 0 36px;font-size:12px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:11px;height:11px;border-radius:2px;display:inline-block;}

  /* ---------- detail pages ---------- */
  .detail-head{padding:0 0 18px;border-bottom:1px solid var(--line);margin-bottom:28px;}
  .breadcrumb{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
  .breadcrumb a{color:var(--accent-2);text-decoration:none;}
  .detail-head h2{font-size:clamp(22px,3vw,30px);margin:0 0 8px;font-weight:800;text-wrap:balance;}
  .type-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .type-pill{
    font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);
    border:1px solid var(--accent-2);background:var(--accent-soft);
    padding:3px 9px;border-radius:20px;
  }
  .detail-desc{max-width:70ch;color:var(--ink-soft);font-size:14.5px;margin-top:12px;}

  .pdf-quote{
    border-left:3px solid var(--accent-2);background:var(--accent-soft);
    padding:13px 18px;border-radius:0 4px 4px 0;margin-top:16px;max-width:74ch;
  }
  .pdf-quote-ref{
    font-family:var(--mono);font-size:10.5px;color:var(--accent);font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;
  }
  .pdf-quote-fi{
    margin:0 0 9px;padding-left:11px;border-left:2px solid var(--line);
    font-style:italic;font-size:12.5px;color:var(--ink-soft);line-height:1.55;
  }
  .pdf-quote-zh{font-size:13.5px;color:var(--ink);line-height:1.65;}

  .layout-2col{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;margin-bottom:36px;align-items:start;}
  @media (max-width:860px){.layout-2col{grid-template-columns:1fr;}}

  .panel{background:#fff;border:1px solid var(--line);border-radius:4px;padding:20px 22px;}
  .panel h3{
    font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);
    margin:0 0 14px;font-weight:700;
  }
  .diagram-panel{
    background:
      linear-gradient(var(--paper-dim) 1px,transparent 1px) 0 0/100% 16px,
      linear-gradient(90deg,var(--paper-dim) 1px,transparent 1px) 0 0/16px 100%,
      #fbfbf8;
  }
  .diagram-panel svg{display:block;width:100%;height:auto;}
  .diagram-legend{font-size:11.5px;color:var(--ink-soft);margin-top:8px;text-align:center;}

  table.def-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.def-table th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);
    border-bottom:1px solid var(--line);padding:0 8px 8px 0;font-weight:600;
  }
  table.def-table td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  table.def-table tr:last-child td{border-bottom:none;}
  .sym{font-family:var(--mono);font-weight:700;color:var(--accent);white-space:nowrap;}
  .fi{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);display:block;margin-top:2px;}

  .case-block{margin-bottom:30px;}
  .case-title{
    font-size:14px;font-weight:700;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .case-title .n{
    font-family:var(--mono);font-size:11px;background:var(--ink);color:#fff;padding:2px 7px;border-radius:2px;
  }

  .calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  @media (max-width:760px){.calc-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
  .field label{font-size:12.5px;color:var(--ink-soft);}
  .field label .sym{margin-right:6px;}
  .field input{
    font-family:var(--mono);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;
    background:#fbfbf8;color:var(--ink);width:100%;
  }
  .field input:focus{outline:2px solid var(--accent-2);outline-offset:0;border-color:var(--accent-2);}

  .result-card{
    border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:12px;background:#fbfbf8;
  }
  .result-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .result-name{font-size:13px;color:var(--ink-soft);}
  .result-value{font-family:var(--mono);font-size:24px;font-weight:700;}
  .result-limit{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .limit-tag{font-family:var(--sans);font-size:10px;color:var(--ink-soft);background:var(--paper-dim);border-radius:3px;padding:1px 6px;margin-left:6px;letter-spacing:.02em;}
  .chip{
    font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em;
  }
  .chip.pass{background:var(--good-bg);color:var(--good);}
  .chip.fail{background:var(--bad-bg);color:var(--bad);}

  details.coef{border:1px solid var(--line);border-radius:4px;margin-top:14px;}
  details.coef summary{
    cursor:pointer;padding:10px 14px;font-size:12.5px;font-weight:600;color:var(--accent);
    list-style:none;display:flex;justify-content:space-between;align-items:center;
  }
  details.coef summary::-webkit-details-marker{display:none;}
  details.coef summary::after{content:"展开 ▾";color:var(--ink-soft);font-weight:500;}
  details.coef[open] summary::after{content:"收起 ▴";}
  .coef-wrap{overflow-x:auto;border-top:1px solid var(--line-soft);padding:12px 14px;}
  table.coef-table{border-collapse:collapse;font-family:var(--mono);font-size:12px;width:100%;min-width:340px;}
  table.coef-table th{text-align:left;color:var(--ink-soft);font-weight:600;padding:4px 14px 6px 0;border-bottom:1px solid var(--line);}
  table.coef-table td{padding:3px 14px 3px 0;white-space:nowrap;font-variant-numeric:tabular-nums;}
  table.coef-table tr:nth-child(even){background:var(--paper-dim);}

  .example-box{
    border:1px dashed var(--accent-2);background:var(--accent-soft);border-radius:4px;padding:16px 18px;margin-top:18px;
  }
  .example-box h4{margin:0 0 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);}
  .example-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;font-family:var(--mono);font-size:12.5px;}
  .example-grid .k{color:var(--ink-soft);}
  .example-grid .v{font-weight:700;}

  .note-box{
    border-left:3px solid var(--warn);background:#fbf3ec;padding:12px 16px;border-radius:0 3px 3px 0;
    font-size:13px;color:#5c3d24;margin-top:16px;
  }
  .link-out{
    display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;font-weight:600;
    color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-2);padding-bottom:1px;
  }

  footer.foot{
    margin-top:60px;padding-top:22px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;
  }
  footer.foot a{color:var(--accent-2);}

  .nav-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px;}
  .nav-tabs button{
    font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    padding:7px 12px;border-radius:20px;cursor:pointer;
  }
  .nav-tabs button:hover{border-color:var(--accent-2);color:var(--accent);}
  .nav-tabs button.current{background:var(--accent);border-color:var(--accent);color:#fff;}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>

<header class="top">
  <div class="top-inner">
    <div class="brand" id="brandHome" tabindex="0" role="button" aria-label="返回总览">
      <div class="brand-mark">FI</div>
      <div class="brand-text">
        <div class="eyebrow">Traficom 304841/2019</div>
        <h1>芬兰 HCT（High Capacity Transport）通道圆计算手册</h1>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn ghost" id="topHomeBtn">↺ 总览</button>
    </div>
  </div>
</header>

<div class="app">
  <div class="shell">

    <!-- ============ 常驻左侧导航：场景 + 计算页，与右侧内容并行 ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="side-block">
        <div class="section-label small">11 种组合类型</div>
        <div class="side-list" id="sideScenarioList"></div>
      </div>
      <div class="side-block">
        <div class="section-label small">7 个计算页</div>
        <div class="side-list" id="sideTabList"></div>
      </div>
    </aside>

    <!-- ============ 右侧内容：总览或计算页详情，随点击切换 ============ -->
    <main class="content" id="mainContent"></main>

  </div>

  <footer class="foot">
    <span>数据整理自 Traficom 法规原文与官方计算器 Excel，仅供工程参考；正式合规判定请以原始文件及授权专家意见为准。</span>
    <span><a href="https://drive.google.com/file/d/1s1hAwW1lJP4yAF2ArdvLhxSFDEWv9wDF/view" target="_blank" rel="noopener">中文翻译版 PDF</a></span>
  </footer>
</div>

<script>
/* ======================================================================
   1. 车辆单元示意图渲染
   ====================================================================== */
const UNIT_SPECS = {
  tractor:{fill:'#26545f',dark:'#173a42',label:'牵引车',
    body:(x)=>`<rect x="${x+14}" y="18" width="76" height="40" rx="5" fill="${UNIT_SPECS.tractor.fill}"/>
                <rect x="${x+14}" y="4" width="26" height="34" rx="4" fill="${UNIT_SPECS.tractor.dark}"/>`,
    wheels:(x)=>[[x+32,80],[x+72,80],[x+86,80]],
    landmarks:(x)=>({front:x+32, axle:x+79, rear:x+92, tail:x+92})},
  semi:{fill:'#b3752c',label:'半挂车',
    body:(x)=>`<rect x="${x+4}" y="30" width="96" height="30" rx="4" fill="${UNIT_SPECS.semi.fill}"/>
                <circle cx="${x+13}" cy="45" r="4" fill="#fff" stroke="${UNIT_SPECS.semi.fill}" stroke-width="2"/>`,
    wheels:(x)=>[[x+78,74],[x+92,74]],
    landmarks:(x)=>({front:x+13, axle:x+85, rear:x+97, tail:x+100})},
  dolly:{fill:'#5c6b66',label:'Dolly',
    body:(x)=>`<line x1="${x}" y1="50" x2="${x+30}" y2="50" stroke="${UNIT_SPECS.dolly.fill}" stroke-width="4"/>
                <rect x="${x+28}" y="40" width="46" height="20" rx="3" fill="${UNIT_SPECS.dolly.fill}"/>
                <circle cx="${x+73}" cy="42" r="4" fill="#fff" stroke="${UNIT_SPECS.dolly.fill}" stroke-width="2"/>`,
    wheels:(x)=>[[x+52,66]],
    landmarks:(x)=>({front:x+5, axle:x+52, rear:x+73, tail:x+74})},
  centeraxle:{fill:'#3c7a4e',label:'中置轴挂车',
    body:(x)=>`<line x1="${x}" y1="50" x2="${x+24}" y2="40" stroke="${UNIT_SPECS.centeraxle.fill}" stroke-width="3"/>
                <line x1="${x}" y1="50" x2="${x+24}" y2="60" stroke="${UNIT_SPECS.centeraxle.fill}" stroke-width="3"/>
                <rect x="${x+15}" y="32" width="82" height="28" rx="4" fill="${UNIT_SPECS.centeraxle.fill}"/>`,
    wheels:(x)=>[[x+52,72]],
    landmarks:(x)=>({front:x+3, axle:x+52, rear:x+97, tail:x+97})},
  full:{fill:'#6a4a94',label:'全挂车',
    body:(x)=>`<line x1="${x}" y1="50" x2="${x+14}" y2="50" stroke="${UNIT_SPECS.full.fill}" stroke-width="4"/>
                <rect x="${x+10}" y="30" width="88" height="30" rx="4" fill="${UNIT_SPECS.full.fill}"/>`,
    wheels:(x)=>[[x+30,74],[x+86,74]],
    landmarks:(x)=>({front:x+3, axle:x+30, axle2:x+86, tail:x+96})}
};
const SLOT=100, GAP=16;
const ANNOTATION_ROW_H = 17;
const ANNOTATION_COLOR = '#a95a26';

function buildRig(units, opts){
  opts = opts||{};
  const n=units.length;
  const w = n*SLOT + (n-1)*GAP + 20;
  const TOP_PAD = opts.noLabels ? 0 : 20;   // 顶部留给车辆类型文字（牵引车/半挂车…）的空间
  const CONTENT_H = 96;                      // 车身+车轮自身占用的高度（不含顶部文字、不含标注行）
  const ANNOT_Y0 = 92;                       // 标注第一行相对于车身局部坐标系的起始 y
  let content='';   // 会整体下移 TOP_PAD，放在车身/车轮/标注所在的坐标系里
  let topLabels=''; // 不下移，固定贴在图的最上方

  // 布局：先算每个单元的 x 偏移与坐标点，标注需要用到
  const unitX = units.map((type,i)=>10 + i*(SLOT+GAP));

  // 标注：把每个符号换算成像素区间。当区间本身（或区间连同其文字标签的宽度）
  // 与同一单元内其他标注重叠时，自动错开到下一行，避免相邻短区间的文字挤在一起。
  let rows = [];
  const segs = [];
  if(opts.annotations && opts.annotations.length){
    const byUnit = {};
    opts.annotations.forEach(a=>{
      const lm = UNIT_SPECS[units[a.unit]].landmarks(unitX[a.unit]);
      const x1 = lm[a.from], x2 = lm[a.to];
      if(x1===undefined || x2===undefined) return;
      const segX1 = Math.min(x1,x2), segX2 = Math.max(x1,x2);
      const mid = (segX1+segX2)/2;
      const labelHalf = (a.symbol.length*4.7+5)/2;
      // “占用区间”取线段本身与文字宽度中较大的一个，专门用于行分配判定
      const packX1 = Math.min(segX1, mid-labelHalf);
      const packX2 = Math.max(segX2, mid+labelHalf);
      (byUnit[a.unit] = byUnit[a.unit]||[]).push({symbol:a.symbol, x1:segX1, x2:segX2, packX1, packX2});
    });
    Object.values(byUnit).forEach(list=>{
      list.sort((a,b)=>a.packX1-b.packX1);
      const unitRows = []; // unitRows[r] = 该行已占用到的最大 x（含文字宽度）
      list.forEach(seg=>{
        let r = 0;
        while(unitRows[r]!==undefined && seg.packX1 < unitRows[r]-0.01) r++;
        unitRows[r] = seg.packX2;
        segs.push({...seg, row:r});
      });
    });
    rows = segs.map(s=>s.row);
  }
  const maxRow = rows.length ? Math.max(...rows) : -1;
  const h = TOP_PAD + CONTENT_H + (maxRow>=0 ? (maxRow+1)*ANNOTATION_ROW_H + 6 : 0);

  units.forEach((type,i)=>{
    const x = unitX[i];
    if(i>0){
      content += `<line x1="${x-GAP}" y1="50" x2="${x}" y2="50" stroke="#9aa39c" stroke-width="2.5"/>`;
      content += `<circle cx="${x-GAP/2}" cy="50" r="2.5" fill="#9aa39c"/>`;
    }
    const spec = UNIT_SPECS[type];
    content += spec.body(x);
    spec.wheels(x).forEach(([wx,wy])=>{
      content += `<circle cx="${wx}" cy="${wy}" r="8.5" fill="#20282a"/><circle cx="${wx}" cy="${wy}" r="3" fill="#5b6360"/>`;
    });
    if(!opts.noLabels){
      topLabels += `<text x="${x+50}" y="13" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#4d5651">${spec.label}</text>`;
    }
  });

  segs.forEach(seg=>{
    const y = ANNOT_Y0 + seg.row*ANNOTATION_ROW_H;
    content += `<line x1="${seg.x1}" y1="${y}" x2="${seg.x2}" y2="${y}" stroke="${ANNOTATION_COLOR}" stroke-width="1.2"/>`;
    content += `<line x1="${seg.x1}" y1="${y-3.5}" x2="${seg.x1}" y2="${y+3.5}" stroke="${ANNOTATION_COLOR}" stroke-width="1.2"/>`;
    content += `<line x1="${seg.x2}" y1="${y-3.5}" x2="${seg.x2}" y2="${y+3.5}" stroke="${ANNOTATION_COLOR}" stroke-width="1.2"/>`;
    content += `<text x="${(seg.x1+seg.x2)/2}" y="${y-3.5}" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" font-weight="700" fill="${ANNOTATION_COLOR}">${seg.symbol}</text>`;
  });

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="车辆组合示意图">${topLabels}<g transform="translate(0,${TOP_PAD})">${content}</g></svg>`;
}

};

function evalFormula(terms, vals){
  let sum=0;
  for(const [name,coef] of terms){
    if(name==='X'){sum+=coef;continue;}
    let v;
    if(name.includes(':')){const [a,b]=name.split(':');v=vals[a]*vals[b];}
    else if(name.endsWith('^2')){const a=name.slice(0,-2);v=vals[a]*vals[a];}
    else{v=vals[name];}
    sum+=coef*v;
  }
  return sum;
}

        <span>·</span>
        <a href="https://drive.google.com/file/d/1VU0acLLOgsjTD6SwEuX0p-bQd6GONw5f/view" target="_blank" rel="noopener">HCT-määräys laskuri 4.0.xlsx</a>
        <span>·</span>
        <a href="https://drive.google.com/file/d/1s1hAwW1lJP4yAF2ArdvLhxSFDEWv9wDF/view" target="_blank" rel="noopener">中文翻译版 PDF</a>
      </div>
    </div>

    <div class="section-label">11 种组合类型 · Yhdistelmätyypit 1–11</div>
    <div class="legend">${LEGEND_ITEMS.map(([c,l])=>`<span><i class="swatch" style="background:${c}"></i>${l}</span>`).join('')}</div>

    <div class="section-label">7 个计算页对照 · Excel 分页</div>
    <div class="grid">${TAB_ORDER.map(tabCardHtml).join('')}</div>
  `;
}

function fmtNum(n){
  if(Math.abs(n) < 1e-4 && n !== 0) return n.toExponential(3);
  return (Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
}
function fmtCoef(n){
  if(Math.abs(n) !== 0 && (Math.abs(n) < 1e-4 || Math.abs(n) >= 1e6)) return n.toExponential(4);
  return n.toString();
}
function termLabel(name){
  if(name==='X') return '截距 (Intercept)';
  if(name.includes(':')) return name.split(':').join(' × ');
  if(name.endsWith('^2')) return name.slice(0,-2)+' ²';
  return name;
}

function navHtml(activeId){
  return `<div class="nav-tabs">
    ${TAB_ORDER.map(id=>`<button class="${id===activeId?'current':''}" data-nav="${id}">计算页 ${id}</button>`).join('')}
  </div>`;
}

function renderCalcCase(tabId, caseIndex, kase){
  const inputIds = kase.inputs.map(i=>`t${tabId}c${caseIndex}_${i.key}`);
  const inputsHtml = kase.inputs.map(inp=>`
    <div class="field">
      <label><span class="sym">${inp.key}</span>${inp.def}</label>
      <input type="number" step="1" id="t${tabId}c${caseIndex}_${inp.key}" value="${inp.val}"/>
    </div>`).join('');

  const outputsHtml = kase.outputs.map((out,oi)=>`
    <div class="result-card" id="t${tabId}c${caseIndex}_out${oi}">
      <div class="result-top">
        <span class="result-name">${out.name}</span>
        <span class="chip" id="t${tabId}c${caseIndex}_chip${oi}">–</span>
      </div>
      <div class="result-value" id="t${tabId}c${caseIndex}_val${oi}">–</div>
      <div class="result-limit">${out.limit==='min'?'要求 ≥':'要求 ≤'} <b>${fmtNum(out.limitDef)}</b> mm <span class="limit-tag">附件9规定值</span></div>
      <details class="coef">
        <summary>系数表 · ${out.terms.length} 项</summary>
        <div class="coef-wrap">
          <table class="coef-table">
            <tr><th>项</th><th>系数</th></tr>
            ${out.terms.map(([n,c])=>`<tr><td>${termLabel(n)}</td><td>${fmtCoef(c)}</td></tr>`).join('')}
          </table>
        </div>
      </details>
    </div>`).join('');

  return `<div class="case-block" data-case-tab="${tabId}" data-case-idx="${caseIndex}">
    <div class="case-title"><span class="n">${caseIndex+1}</span>${kase.name}</div>
    <div class="calc-grid">
      <div>${inputsHtml}</div>
      <div>${outputsHtml}</div>
    </div>
  </div>`;
}

function recalcCase(tabId, caseIndex, kase){
  const vals = {};
  kase.inputs.forEach(inp=>{
    const el = document.getElementById(`t${tabId}c${caseIndex}_${inp.key}`);
    vals[inp.key] = parseFloat(el.value);
  });
  kase.outputs.forEach((out,oi)=>{
    // 内圆半径与后角偏移的回归输出以"到中心线的位移"为原始符号约定，
    // 法规比较的是其绝对值（半径 / 偏移量），故统一取绝对值。
    const result = Math.abs(evalFormula(out.terms, vals));
    const limit = out.limitDef;
    const pass = out.limit==='min' ? result >= limit : result <= limit;
    document.getElementById(`t${tabId}c${caseIndex}_val${oi}`).textContent = fmtNum(result)+' mm';
    const chip = document.getElementById(`t${tabId}c${caseIndex}_chip${oi}`);
    chip.textContent = pass ? '符合 PASS' : '不符合 FAIL';
    chip.className = 'chip ' + (pass?'pass':'fail');
  });
}

function wireCase(tabId, caseIndex, kase){
  const root = document.querySelector(`.case-block[data-case-tab="${tabId}"][data-case-idx="${caseIndex}"]`);
  root.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>recalcCase(tabId,caseIndex,kase)));
  recalcCase(tabId, caseIndex, kase);
}

function renderTab(id){
  const t = TABS[id];
  const casesHtml = t.cases.map((k,ci)=>renderCalcCase(id,ci,k)).join('');
  return `

        <div class="pdf-quote-zh">${t.pdfQuote.zh}</div>

      <a class="link-out" href="https://drive.google.com/file/d/1r-vt5I9YlvqCnDaDeHX64utC2RfO4z3M/view" target="_blank" rel="noopener">查看法规原文 PDF →</a>
      <a class="link-out" style="margin-left:18px;" href="https://drive.google.com/file/d/1VU0acLLOgsjTD6SwEuX0p-bQd6GONw5f/view" target="_blank" rel="noopener">打开官方计算 Excel →</a>
      <a class="link-out" style="margin-left:18px;" href="https://drive.google.com/file/d/1s1hAwW1lJP4yAF2ArdvLhxSFDEWv9wDF/view" target="_blank" rel="noopener">查看中文翻译 PDF →</a>
    </div>`;
}

/* ======================================================================
   6. 常驻侧边栏 + 路由（侧边栏与内容区并行渲染，切换只替换右侧内容）
   ====================================================================== */
const mainContent = document.getElementById('mainContent');
document.getElementById('sideScenarioList').innerHTML = SCENARIOS.map(sideScenarioItemHtml).join('');
document.getElementById('sideTabList').innerHTML = TAB_ORDER.map(sideTabItemHtml).join('');

function updateSidebarActive(activeTabId){
  document.querySelectorAll('.side-item[data-active-tab]').forEach(el=>{
    const t = parseInt(el.getAttribute('data-active-tab'),10);
    el.classList.toggle('active', activeTabId!==null && t===activeTabId);
  });
}

function showIntro(){
  mainContent.innerHTML = renderIntro();
  updateSidebarActive(null);
  window.scrollTo({top:0,behavior:'instant' in window ? 'instant':'auto'});
  location.hash = '';
}

function selectTab(id){
  mainContent.innerHTML = renderTab(id);
  TABS[id].cases.forEach((k,ci)=>wireCase(id,ci,k));
  updateSidebarActive(id);
  window.scrollTo({top:0,behavior:'instant' in window ? 'instant':'auto'});
  location.hash = 'tab-'+id;
}

// 事件委托：总览大卡、侧边栏条目、计算页内的返回链接/切页按钮共用同一套处理
document.addEventListener('click', (e)=>{
  const navBtn = e.target.closest('[data-nav]');
  if(navBtn){
    e.preventDefault();
    const v = navBtn.getAttribute('data-nav');
    if(v==='home') showIntro(); else selectTab(parseInt(v,10));
    return;
  }
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ selectTab(parseInt(tabBtn.getAttribute('data-tab'),10)); return; }
  const scBtn = e.target.closest('[data-scenario]');
  if(scBtn){
    const s = SCENARIOS.find(x=>x.type===parseInt(scBtn.getAttribute('data-scenario'),10));
    if(s && s.tab) selectTab(s.tab);
  }
});

document.getElementById('brandHome').addEventListener('click', showIntro);
document.getElementById('brandHome').addEventListener('keypress',(e)=>{if(e.key==='Enter') showIntro();});
document.getElementById('topHomeBtn').addEventListener('click', showIntro);

// initial route
const m = location.hash.match(/tab-(\d)/);
if(m){ selectTab(parseInt(m[1],10)); } else { showIntro(); }
